name: CI-CD Deployment Pipeline

on:
  push:
    branches: [ "main" ]  

jobs:
  deploy:
    runs-on: self-hosted  # Targets Lightsail server
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Ensure GGUF model exists on host
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          MODEL_HOST_DIR: /opt/intelligrader/models
          MODEL_FILE: Intelligrader_SAQ_Grader_Qwen.gguf
          HF_REPO_ID: DevomB/Intelligrader-Models
        run: |
          set -euo pipefail
          mkdir -p "$MODEL_HOST_DIR"

          if [ -f "$MODEL_HOST_DIR/$MODEL_FILE" ]; then
            echo "Using cached model: $MODEL_HOST_DIR/$MODEL_FILE"
          else
            echo "Model not found on host. Downloading from Hugging Face..."
            python3 -m pip install --upgrade --no-cache-dir huggingface-hub
            if [ -n "${HF_TOKEN:-}" ]; then
              huggingface-cli download "$HF_REPO_ID" "$MODEL_FILE" --local-dir "$MODEL_HOST_DIR" --token "$HF_TOKEN"
            else
              huggingface-cli download "$HF_REPO_ID" "$MODEL_FILE" --local-dir "$MODEL_HOST_DIR"
            fi
          fi

      - name: Deploy with Docker Compose
        run: |
          export MODEL_HOST_DIR="${MODEL_HOST_DIR:-/opt/intelligrader/models}"
          docker compose down --remove-orphans
          
          docker compose up -d --build
          
          docker image prune -f

      - name: Status Check
        run: docker ps