name: Status Check

on:
  workflow_run:
    workflows: ["CI-CD Deployment Pipeline"]
    types:
      - completed

jobs:
  status-check:
    runs-on: self-hosted
    
    steps:
      - name: Check Service Endpoints
        env:
          HOST_IP: ${{ secrets.HOST_IP }}
        run: |
          # Base endpoints that must be reachable
          endpoints=("/health" "/docs")
          
          errorCount=0
          
          # Loop through each endpoint
          for endpoint in "${endpoints[@]}"; do
            endpoint_to_check="${HOST_IP}${endpoint}"
            echo "Checking endpoint: ${endpoint_to_check}"
            
            # Check the endpoint
            if ! curl -f -s -o /dev/null -w "%{http_code}" --max-time 10 "${endpoint_to_check}" > /dev/null 2>&1; then
              echo "ERROR: Failed to reach ${endpoint_to_check}"
              errorCount=$((errorCount + 1))
            else
              echo "SUCCESS: ${endpoint_to_check} is reachable"
            fi
          done
          
          # If any errors occurred, fail the job
          if [ $errorCount -ge 1 ]; then
            echo "Status check failed: ${errorCount} endpoint(s) unreachable"
            exit 1
          fi

          # Generation readiness smoke test
          echo "Running generation smoke test: ${HOST_IP}/generate"
          generate_response=$(curl -s --max-time 30 \
            -H "Content-Type: application/json" \
            -X POST \
            -d '{"prompt":"Healthcheck ping","max_tokens":8,"temperature":0.2,"top_p":0.9}' \
            "${HOST_IP}/generate")

          if [[ "${generate_response}" != *"generated_text"* ]]; then
            echo "Status check failed: generation smoke test failed"
            echo "Response: ${generate_response}"
            exit 1
          else
            echo "All endpoint and generation checks passed"
            exit 0
          fi
