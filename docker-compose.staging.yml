version: "3.8"

services:
  intelligrader-api-staging:
    build: .
    container_name: intelligrader-api-staging
    restart: unless-stopped
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8001"]
    volumes:
      - models_staging:/app/models
    networks:
      - web_network_staging

  nginx-staging:
    image: nginx:alpine
    depends_on:
      - intelligrader-api-staging
    container_name: intelligrader-nginx-staging
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx/conf.d/staging.peral.one.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/ssl/staging.peral.one.pem:/etc/ssl/staging.peral.one.pem:ro
      - /etc/ssl/staging.peral.one.key:/etc/ssl/staging.peral.one.key:ro
    networks:
      - web_network_staging

volumes:
  models_staging:
    name: intelligrader_models_staging

networks:
  web_network_staging:
    name: intelligrader_web_network_staging
    driver: bridge
