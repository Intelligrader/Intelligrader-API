version: "3.8"
name: intelligrader-prod

services:
  intelligrader-api:
    build: .
    container_name: intelligrader-prod-api
    restart: unless-stopped
    networks:
      - intelligrader-prod-net

  nginx:
    image: nginx:alpine
    container_name: intelligrader-prod-nginx
    depends_on:
      - intelligrader-api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d/peral.one.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/ssl/peral.one.pem:/etc/ssl/peral.one.pem:ro
      - /etc/ssl/peral.one.key:/etc/ssl/peral.one.key:ro
    networks:
      - intelligrader-prod-net

networks:
  intelligrader-prod-net:
    name: intelligrader-prod-net
    driver: bridge
